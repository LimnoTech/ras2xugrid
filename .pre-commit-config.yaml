repos:
  - repo: https://github.com/mwouts/jupytext
    rev: v1.19.6
    hooks:
      - id: jupytext
        args: [--sync]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        # ruff 0.17's hook also formats Markdown code blocks; keep it to Python.
        types_or: [python, pyi]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
        # Living Markdown only: not dated records, research guides or notebooks.
        exclude: '^(docs/hecras-plan-files\.md|examples/|CHANGELOG\.md$|CLAUDE\.md$)|(^|/)log\.md$'
