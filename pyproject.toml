[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ras2xugrid"
dynamic = ["version"]
description = "Read HEC-RAS 2D plan files (HDF5) into xugrid, with the HEC-RAS names and units kept verbatim, and sum face flows across cross sections."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
  { name = "Anthony Aufdenkampe", email = "aaufdenkampe@limno.com" },
  { name = "Jason Rutyna", email = "jrutyna@limno.com" },
  { name = "Sarah Jordan" },
]
maintainers = [
  { name = "Anthony Aufdenkampe", email = "aaufdenkampe@limno.com" },
  { name = "Jason Rutyna", email = "jrutyna@limno.com" },
]
keywords = [
  "hec-ras",
  "hydraulics",
  "mesh",
  "ugrid",
  "xarray",
  "xugrid",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Hydrology",
]

# The one runtime list, in PyPI names: what src/ras2xugrid imports (the viz module's packages are
# the `viz` extra below). pixi-build-python maps it to conda names for the package's record.
# No plotting library in this list, and no dependency on any other LimnoTech package.
dependencies = [
  "h5py",  # _hdf.py opens the plan files
  "numpy",
  "pandas",
  "pyarrow",  # pandas 3 backs its str dtype with pyarrow only when installed
  "pyproj",
  "shapely",
  "xarray",
  "xugrid",
]

# The public extras, for `pip install "ras2xugrid[viz]"` users. They never reach the conda record
# (a source package carries no extras): this repository's own environment takes the same packages
# from the `viz` and `jupyter` features, in conda names.
[project.optional-dependencies]
jupyter = [
  "jupyterlab",
  "jupytext",
]
viz = [
  "bokeh",
  "colorcet>=3.2.1",
  "datashader",
  "holoviews>=1.23",
]

[project.urls]
Homepage = "https://github.com/LimnoTech/ras2xugrid"
Repository = "https://github.com/LimnoTech/ras2xugrid"
Issues = "https://github.com/LimnoTech/ras2xugrid/issues"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------

[tool.hatch.version]
source = "vcs"
# Used only when git metadata is missing (e.g. a GitHub source ZIP); tagged builds ignore it.
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/ras2xugrid/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ras2xugrid"]

# ---------------------------------------------------------------------------
# Pixi workspace
# ---------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge", "nodefaults"]
platforms = ["linux-64", "osx-arm64", "win-64"]
# pixi-build is a preview. requires-pixi is a floor, the pixi the locks were last made or
# checked with; CI's setup-pixi steps pin that exact version, and a weekly canary runs the
# latest (tests/test_package_section.py). Moving the floor is a deliberate change.
preview = ["pixi-build"]
requires-pixi = ">=0.84.2"

# Self-install as a pixi-build source package, in the implicit default feature so every
# environment gets it: this repository consumes itself as its consumers do.
[tool.pixi.dependencies]
ras2xugrid = { path = "." }

# ras2xugrid as a pixi-build source package: a consumer that names it under a conda
# [dependencies] table gets its record in its own solve. With ignore-pypi-mapping = false,
# pixi-build-python writes the record from [project.dependencies] (PyPI names, mapped to conda
# names) plus the run-dependencies and run-constraints below, so its floors reach the consumer on
# a plain `pixi lock`. tests/test_package_section.py checks the record pixi locked.
[tool.pixi.package]
name = "ras2xugrid"
# The last release, bumped beside CHANGELOG.md in each release-preparation PR. It is the conda
# record's version, which a consumer can floor; __version__ still comes from hatch-vcs.
version = "0.1.0"

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "*" }

# Map [project.dependencies] to conda names for the record. Without it the record carries only
# python and the run-dependencies below.
[tool.pixi.package.build.config]
ignore-pypi-mapping = false

[tool.pixi.package.host-dependencies]
hatchling = "*"
hatch-vcs = "*"
python = "3.12.*"

# Only what [project.dependencies] cannot say: no family package and no conda-only Python package
# here. ras2xugrid has no family package below it, so it declares the sqlite floor for its own
# chain.
[tool.pixi.package.run-dependencies]
sqlite = ">=3.38"             # the GDAL/PROJ stack leaves it unbounded; a system library

# The viz floors: the versioned entries of feature.viz (and the viz extra). Constraints, not
# dependencies, so a consumer that draws maps declares the package itself and gets the floor, and
# one that does not installs nothing from viz.
[tool.pixi.package.run-constraints]
colorcet = ">=3.2.1"
holoviews = ">=1.23"

# Only the environment's python: the runtime list is [project.dependencies], through the package.
[tool.pixi.feature.core.dependencies]
python = "3.12.*"

[tool.pixi.feature.viz.dependencies]
bokeh = "*"
colorcet = ">=3.2.1"
datashader = "*"
holoviews = ">=1.23"

[tool.pixi.feature.jupyter.dependencies]
jupyterlab = "*"
jupytext = "*"
nodejs = "*"                  # JupyterLab build tooling, not a Python import

# The `examples` environment adds what the example notebook imports beyond `core`, `viz` and
# `jupyter`: hvPlot for its line plots, and the pieces HoloViews' notebook output needs. It is
# notebook-only: no extra, and `default` and `ci` do not get it.
#
# `examples` stays in solve-group "default" on purpose: ras2xugrid's own tests then run against
# the versions the example uses.
[tool.pixi.feature.examples.dependencies]
hvplot = ">=0.12"
ipywidgets = "*"
jupyter_bokeh = "*"
pyviz_comms = "*"

[tool.pixi.feature.dev.dependencies]
pre-commit = "*"
pyrefly = "*"
pytest = "*"
pytest-cov = "*"
pyyaml = "*"                  # tests/test_package_section.py reads pixi.lock in the lean ci env
ruff = "*"
zarr = ">=3"

[tool.pixi.environments]
default = { features = ["core", "viz", "jupyter", "dev"], solve-group = "default" }
ci = { features = ["core", "viz", "dev"], solve-group = "default" }
examples = { features = ["core", "viz", "jupyter", "examples"], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest"
test-local = "pytest -m local_data"
lint = "ruff check src tests"
format = "ruff format src tests"
typecheck = "pyrefly check src/ras2xugrid"

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.ruff]
line-length = 88
# Notebooks are jupytext scripts: top-level statements and display-only expressions
# are normal there, so they are not linted.
extend-exclude = ["examples"]
# The pre-commit hook passes filenames explicitly, and ruff ignores exclude settings for
# explicitly-passed paths unless this is set.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W505"]

[tool.ruff.lint.pycodestyle]
# Code at 88 (the formatter), any line at most 100 (E501),
# docstrings and comments at 72 (W505).
max-line-length = 100
max-doc-length = 72

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not local_data'"
markers = [
  "local_data: reads real HEC-RAS plan files from the folder in HECRAS_TEST_DATA; deselected by default, run with `pixi run test-local`",
]

[tool.pyrefly]
project-includes = ["src/ras2xugrid"]
python-version = "3.12"
